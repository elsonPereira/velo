# Workflow de Integração Contínua focado em execução de testes unitários
# Estrutura preparada para expansão futura (novos jobs, stages, etc.)

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  # Versão do Node utilizada em todo o workflow
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: brito-d-elson
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test
  
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install
      
      - name: Pull Vercel Config
        run: |
          yarn vercel pull --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      - name: Assert Preview Supabase env
        run: |
          FILE=".vercel/.env.preview.local"
          if [ ! -f "$FILE" ]; then
            echo "Arquivo $FILE não encontrado após vercel pull"
            ls -la .vercel/ || true
            exit 1
          fi
          for KEY in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            if ! grep -q "^${KEY}=.\+" "$FILE"; then
              echo "::error::$KEY ausente ou vazio no ambiente Preview da Vercel"
              exit 1
            fi
            echo "$KEY=ok"
          done

      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          yarn --silent vercel deploy --prebuilt \
            --target=preview \
            --token=$VERCEL_TOKEN \
            --scope=$VERCEL_SCOPE \
            | tee /tmp/vercel-deploy.txt
          URL=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.vercel\.app' /tmp/vercel-deploy.txt | tail -n1)
          if [ -z "$URL" ]; then
            echo "::error::Não foi possível extrair a URL do deploy preview"
            cat /tmp/vercel-deploy.txt
            exit 1
          fi
          echo "Preview URL: $URL"
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      - name: Pull Vercel Preview Env
        run: |
          yarn vercel env pull .env --yes \
          --environment=preview \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      - name: Assert E2E DATABASE_URL
        run: |
          if ! grep -q '^DATABASE_URL=.\+' .env; then
            echo "::error::DATABASE_URL ausente no ambiente Preview da Vercel (necessária para insert/delete nos E2E)"
            exit 1
          fi
          echo "DATABASE_URL=ok"

      - name: Wait for Preview
        run: |
          URL="${{ needs.build-and-deploy.outputs.deployment-url }}"
          echo "Aguardando $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Preview respondeu 200"
              exit 0
            fi
            echo "tentativa $i: HTTP $CODE"
            sleep 2
          done
          echo "::error::Preview não respondeu 200 a tempo"
          exit 1

      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  # Rebuild com env de Production: VITE_* é embutida no bundle em tempo de build.
  # vercel promote reutilizaria o artefato de preview (Supabase de preview) — inválido para prod.
  deploy-production:
    name: Build & Deploy Vercel Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Pull Vercel Config (production)
        run: |
          yarn vercel pull --yes \
          --environment=production \
          --token=$VERCEL_TOKEN \
          --scope=$VERCEL_SCOPE

      - name: Assert Production Supabase env
        run: |
          FILE=".vercel/.env.production.local"
          if [ ! -f "$FILE" ]; then
            echo "Arquivo $FILE não encontrado após vercel pull"
            ls -la .vercel/ || true
            exit 1
          fi
          for KEY in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            if ! grep -q "^${KEY}=.\+" "$FILE"; then
              echo "::error::$KEY ausente ou vazio no ambiente Production da Vercel"
              exit 1
            fi
            echo "$KEY=ok"
          done

      - name: Build Vercel (production)
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy production
        id: deploy
        run: |
          set -euo pipefail
          yarn --silent vercel deploy --prebuilt \
            --prod \
            --token=$VERCEL_TOKEN \
            --scope=$VERCEL_SCOPE \
            | tee /tmp/vercel-deploy.txt
          URL=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.vercel\.app' /tmp/vercel-deploy.txt | tail -n1)
          if [ -z "$URL" ]; then
            echo "::error::Não foi possível extrair a URL do deploy production"
            cat /tmp/vercel-deploy.txt
            exit 1
          fi
          echo "Production URL: $URL"
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
